[package]
name = "rustory"
version = "0.1.0"
edition = "2024"
autobins = false

[[bin]]
name = "rr"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.5"
futures = "0.3"
libp2p = { version = "0.56", default-features = false, features = ["tokio", "macros", "tcp", "dns", "noise", "request-response", "identify", "ping", "relay", "dcutr", "pnet"] }
libp2p-mplex = "0.43"
libp2p-request-response = { version = "0.29", features = ["json"] }
rand = "0.8"
regex = "1.12"
rusqlite = { version = "0.39", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tiny_http = "0.12"
time = { version = "0.3", features = ["serde", "macros"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
toml = "1.1"
ureq = "2.12"
urlencoding = "2.1"
uuid = { version = "1.23", features = ["v4", "v5", "serde"] }
zstd = "0.13"

[dev-dependencies]
tempfile = "3.27"
