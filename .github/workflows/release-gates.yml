name: Release Gates

on:
  pull_request:
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "scripts/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "lefthook.yml"
      - ".github/workflows/release-gates.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "docs/**"
      - "scripts/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "lefthook.yml"
      - ".github/workflows/release-gates.yml"
  workflow_dispatch:

jobs:
  release-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pyyaml

      - name: Run lessons-log enforcement (CI parity)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            RANGE="${{ github.event.pull_request.base.sha }}...${{ github.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            BEFORE="${{ github.event.before }}"
            if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
              echo "Skip range-based lessons-log enforcement on initial push."
              exit 0
            fi
            RANGE="$BEFORE...${{ github.sha }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              RANGE="$(git rev-parse HEAD~1)...$(git rev-parse HEAD)"
            else
              echo "Skip range-based lessons-log enforcement on workflow_dispatch (no previous commit)."
              exit 0
            fi
          else
            echo "Skip range-based lessons-log enforcement on event: ${GITHUB_EVENT_NAME}"
            exit 0
          fi
          scripts/check-lessons-log-enforcement.sh --range "$RANGE"

      - name: Run release gates (full manifest mode)
        shell: bash
        run: |
          set -euo pipefail
          if compgen -G 'docs/todo-*' >/dev/null; then
            scripts/check-release-gates.sh --manifest-mode full
          else
            ALLOW_MISSING_WORK_ID_IN_CI=1 scripts/check-release-gates.sh --manifest-mode full --allow-missing-work-id
          fi
